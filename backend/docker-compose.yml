services:
  api:
    build: .
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zhijie:zhijie@db:5432/zhijie
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      LLM_BASE_URL: https://api.lkeap.cloud.tencent.com/coding/v3
      LLM_API_KEY: ${LLM_API_KEY}
    volumes:
      - ./app:/code/app  # hot reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://zhijie:zhijie@db:5432/zhijie
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      LLM_BASE_URL: https://api.lkeap.cloud.tencent.com/coding/v3
      LLM_API_KEY: ${LLM_API_KEY}
    volumes:
      - ./app:/code/app  # hot reload in dev
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  db:
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_DB: zhijie
      POSTGRES_USER: ${POSTGRES_USER:-zhijie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhijie}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhijie -d zhijie"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6383:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
